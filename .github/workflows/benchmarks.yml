name: Benchmarks

on:
  # Run every night at 03:00 UTC - quiet runner hours, results ready by
  # morning. Catches regressions roughly within a day of landing.
  schedule:
    - cron: '0 3 * * *'
  # Manual trigger so contributors can validate a change before pushing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build shadow JAR
        run: ./gradlew shadowJar --no-daemon --stacktrace

      - name: Run JMH microbenchmarks
        run: ./gradlew :benchmarks:jmh --no-daemon --stacktrace

      - name: Run soak + timeout tests
        run: ./gradlew :benchmarks:test --no-daemon --stacktrace

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-reports
          path: |
            benchmarks/build/reports
            benchmarks/build/test-results
          retention-days: 90
          if-no-files-found: ignore
