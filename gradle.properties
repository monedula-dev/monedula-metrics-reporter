kafkaVersion=4.2.2
otelVersion=1.61.0
otelInstrumentationVersion=2.27.0-alpha
otelProtoVersion=1.11.1-alpha
junitBomVersion=5.14.4
yammerMetricsVersion=2.2.0
mockitoVersion=5.24.0
testcontainersVersion=2.0.5
slf4jVersion=2.0.20

# Minimum versions for the native compression codecs Kafka pulls in. Kafka itself
# is compileOnly / test-only here (the broker supplies it and these natives at
# runtime), so none of this reaches the published jar - the floor exists to keep
# known-vulnerable builds out of the CI test JVM and out of dependency scans.
# Each is at or above the first fixed release:
#   snappy-java >= 1.1.10.10  (double-free + OOB family, CVE-2026-108104 et al.)
#   zstd-jni    >= 1.5.7-14   (out-of-bounds read family, CVE-2026-87823 et al.)
#   lz4-java    >= 1.10.2     (TOCTOU); 1.11.2 is what Kafka 4.4.0 ships.
snappyVersion=1.1.10.12
zstdVersion=1.5.7-26
lz4Version=1.11.2
